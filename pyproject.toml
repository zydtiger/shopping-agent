[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopping-agent"
version = "0.1.0"
description = "Terminal shopping agent backbone for interactive retrieval and ranking experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.30.0",
  "playwright>=1.53.0",
  "pyyaml>=6.0.2",
  "textual>=0.60.0",
  "typer>=0.16.0",
]

[dependency-groups]
dev = [
  "mypy>=1.20.1",
  "pre-commit>=4.5.1",
  "pytest>=8.0.0",
  "ruff>=0.15.10",
  "types-PyYAML>=6.0.12.20250915",
]

[project.scripts]
shopping-agent = "shopping_agent.main:run"
shopping-agent-eval = "shopping_agent.evaluation.cli:run"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
pretty = true

[[tool.mypy.overrides]]
module = "textual.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  # flake8-bugbear: catches common correctness issues and risky patterns.
  "B",
  # pycodestyle errors: baseline style and syntax-adjacent issues.
  "E",
  # pyflakes: undefined names, unused imports, and similar logic mistakes.
  "F",
  # isort: keeps imports grouped and ordered consistently.
  "I",
  # pep8-naming: enforces Python naming conventions.
  "N",
  # pyupgrade: prefers modern Python syntax for the target version.
  "UP",
  # pycodestyle warnings: additional whitespace and formatting warnings.
  "W",
]

[tool.ruff.lint.isort]
# Treat the local package as first-party for import grouping.
known-first-party = ["shopping_agent"]

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_agent"]
