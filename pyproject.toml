[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-agent"
version = "0.1.0"
description = "Terminal shopping agent backbone for interactive retrieval and ranking experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.60.0",
]

[dependency-groups]
dev = [
  "mypy>=1.20.1",
  "pre-commit>=4.5.1",
  "pytest>=8.0.0",
  "ruff>=0.15.10",
]

[project.scripts]
shopping-agent = "shopping_agent.main:run"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
pretty = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
